<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The dark-theme favicon, chosen by the media query on index.html's icon
       link. It is the mark of assets/icon.svg with the tile taken away: the
       tile is near black, and on a dark tab strip it would sit as a
       slightly-darker hole. The sun is bright and the lines are the light
       ink, so both read on any dark chrome unaided.

       With the tile gone the art no longer needs its padding, so it is scaled
       1.2 about the centre to fill the box. -->
  <defs>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="226" cy="224" r="175">
      <stop offset="0" stop-color="#ffd392"/>
      <stop offset="0.42" stop-color="#f8a959"/>
      <stop offset="0.72" stop-color="#eb7b49"/>
      <stop offset="1" stop-color="#e0673f"/>
    </radialGradient>
  </defs>
  <g transform="translate(256 256) scale(1.2) translate(-256 -256)">
    <path d="M116 310 A140 140 0 0 1 396 310 Z" fill="url(#sun)"/>
    <path d="M56 310 H456 M150 364 H362" stroke="#f3ede3" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>
</svg>
