<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The monochrome variant, for Android's themed icons. The platform
       recolours it and applies its own mask, so this carries no tile, no
       background and no colour of its own: only the silhouette of the sun
       and the two lines.

       Art sits inside the maskable safe zone (the centre 80%), scaled 0.7
       from assets/icon.svg's geometry, the same as
       assets/icon-maskable-512.png. -->
  <g transform="translate(256 256) scale(0.7) translate(-256 -256)">
    <path d="M116 310 A140 140 0 0 1 396 310 Z" fill="#000000"/>
    <path d="M56 310 H456 M150 364 H362" stroke="#000000" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>
</svg>
