<!-- @dsCard group="Brand" viewport="700x280" name="Iconography" subtitle="Rise icon set: 24px grid, 1.8–1.9 stroke, round caps, currentColor" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--bg-canvas);color:var(--ink)}.mono{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.02em}.m{color:var(--ink-muted)}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.grid{display:grid;gap:12px;padding:16px 20px}.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}</style></head><body><div id="g" style="padding:16px 20px;display:grid;grid-template-columns:repeat(8,1fr);gap:14px"></div><script>const n=["today","plan","recipes","weight","settings","check","lock","warn","info","search","chevronLeft","chevronRight","dairy","pantry","protein","produce"];const g=document.getElementById('g');Promise.all(n.map(k=>fetch('../assets/icons/'+k+'.svg').then(r=>r.text()))).then(t=>{g.innerHTML=t.map((s,i)=>'<div style="text-align:center"><div style="height:44px;display:flex;align-items:center;justify-content:center;transform:scale(1.3)">'+s+'</div><div class="mono m" style="margin-top:6px;font-size:10px">'+n[i]+'</div></div>').join('')})</script></body></html>
