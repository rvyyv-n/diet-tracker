<!-- @dsCard group="Spacing" viewport="700x250" name="Touch targets" subtitle="One-handed, mid-meal: rows 56, buttons 52 / 40, controls 48, icon buttons 44, nav 64" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--bg-canvas);color:var(--ink)}.mono{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.02em}.m{color:var(--ink-muted)}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.grid{display:grid;gap:12px;padding:16px 20px}.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}</style></head><body><div style="padding:16px 20px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap"><div style="text-align:center"><i style="display:block;width:56px;height:56px;border-radius:28px;background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong);margin:0 auto"></i><div class="mono" style="margin-top:6px">--row-min</div><div class="mono m">56px · tick row</div></div><div style="text-align:center"><i style="display:block;width:52px;height:52px;border-radius:26px;background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong);margin:0 auto"></i><div class="mono" style="margin-top:6px">--button-h</div><div class="mono m">52px · button</div></div><div style="text-align:center"><i style="display:block;width:48px;height:48px;border-radius:24px;background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong);margin:0 auto"></i><div class="mono" style="margin-top:6px">--control-h</div><div class="mono m">48px · field / seg</div></div><div style="text-align:center"><i style="display:block;width:44px;height:44px;border-radius:22px;background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong);margin:0 auto"></i><div class="mono" style="margin-top:6px">--icon-button</div><div class="mono m">44px · icon btn / chip</div></div><div style="text-align:center"><i style="display:block;width:44px;height:40px;border-radius:20px;background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong);margin:0 auto"></i><div class="mono" style="margin-top:6px">--button-h-sm</div><div class="mono m">40px · small btn</div></div><div style="text-align:center"><i style="display:block;width:64px;height:64px;border-radius:32px;background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong);margin:0 auto"></i><div class="mono" style="margin-top:6px">--nav-h</div><div class="mono m">64px · phone nav</div></div></div></body></html>
