<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--bg-canvas);color:var(--ink)}.mono{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.02em}.m{color:var(--ink-muted)}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.grid{display:grid;gap:12px;padding:16px 20px}.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr)"><div data-look="paper" data-theme="light" style="background:var(--bg-canvas);color:var(--ink);padding:16px 14px"><div class="mono m" style="margin-bottom:10px">paper · light</div><div style="height:64px;border-radius:var(--radius-card);background:var(--bg-raised);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center" class="mono">shadow-card</div><div style="height:64px;margin-top:14px;border-radius:var(--radius-card);background:var(--bg-raised);box-shadow:var(--shadow-float);display:flex;align-items:center;justify-content:center" class="mono">shadow-float</div><div style="height:30px;margin-top:14px;border-radius:15px;background:var(--scrim)" class="mono"></div><div class="mono m">scrim</div></div><div data-look="paper" data-theme="dark" style="background:var(--bg-canvas);color:var(--ink);padding:16px 14px"><div class="mono m" style="margin-bottom:10px">paper · dark</div><div style="height:64px;border-radius:var(--radius-card);background:var(--bg-raised);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center" class="mono">shadow-card</div><div style="height:64px;margin-top:14px;border-radius:var(--radius-card);background:var(--bg-raised);box-shadow:var(--shadow-float);display:flex;align-items:center;justify-content:center" class="mono">shadow-float</div><div style="height:30px;margin-top:14px;border-radius:15px;background:var(--scrim)" class="mono"></div><div class="mono m">scrim</div></div><div data-look="reel" data-theme="light" style="background:var(--bg-canvas);color:var(--ink);padding:16px 14px"><div class="mono m" style="margin-bottom:10px">reel · light</div><div style="height:64px;border-radius:var(--radius-card);background:var(--bg-raised);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center" class="mono">shadow-card</div><div style="height:64px;margin-top:14px;border-radius:var(--radius-card);background:var(--bg-raised);box-shadow:var(--shadow-float);display:flex;align-items:center;justify-content:center" class="mono">shadow-float</div><div style="height:30px;margin-top:14px;border-radius:15px;background:var(--scrim)" class="mono"></div><div class="mono m">scrim</div></div><div data-look="reel" data-theme="dark" style="background:var(--bg-canvas);color:var(--ink);padding:16px 14px"><div class="mono m" style="margin-bottom:10px">reel · dark</div><div style="height:64px;border-radius:var(--radius-card);background:var(--bg-raised);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center" class="mono">shadow-card</div><div style="height:64px;margin-top:14px;border-radius:var(--radius-card);background:var(--bg-raised);box-shadow:var(--shadow-float);display:flex;align-items:center;justify-content:center" class="mono">shadow-float</div><div style="height:30px;margin-top:14px;border-radius:15px;background:var(--scrim)" class="mono"></div><div class="mono m">scrim</div></div></div></body></html>
