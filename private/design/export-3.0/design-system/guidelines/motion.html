<!-- @dsCard group="Motion" viewport="700x300" name="Motion tokens" subtitle="Daily interactions 90–260ms; sun travel 520ms; all → 0 under reduced motion" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--bg-canvas);color:var(--ink)}.mono{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.02em}.m{color:var(--ink-muted)}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.grid{display:grid;gap:12px;padding:16px 20px}.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}</style></head><body><div style="padding:16px 20px;display:grid;gap:12px"><style>@keyframes go{0%,10%{transform:translateX(0)}60%,100%{transform:translateX(220px)}}.b{width:22px;height:22px;border-radius:50%;background:var(--sun);animation:go 2.4s infinite}</style><div style="display:grid;grid-template-columns:260px 1fr;align-items:center;gap:12px"><div><div class="mono">--dur-instant</div><div class="mono m">90ms · press</div></div><div style="height:22px;border-bottom:1.5px solid var(--line-strong)"><div class="b" style="animation-timing-function:var(--ease-out)"></div></div></div><div style="display:grid;grid-template-columns:260px 1fr;align-items:center;gap:12px"><div><div class="mono">--dur-fast</div><div class="mono m">160ms · hover, toggle</div></div><div style="height:22px;border-bottom:1.5px solid var(--line-strong)"><div class="b" style="animation-timing-function:var(--ease-out)"></div></div></div><div style="display:grid;grid-template-columns:260px 1fr;align-items:center;gap:12px"><div><div class="mono">--dur-base</div><div class="mono m">260ms · sheet, toast</div></div><div style="height:22px;border-bottom:1.5px solid var(--line-strong)"><div class="b" style="animation-timing-function:var(--ease-out)"></div></div></div><div style="display:grid;grid-template-columns:260px 1fr;align-items:center;gap:12px"><div><div class="mono">--dur-slow</div><div class="mono m">520ms · sun travel</div></div><div style="height:22px;border-bottom:1.5px solid var(--line-strong)"><div class="b" style="animation-timing-function:var(--ease-out)"></div></div></div><div style="display:grid;grid-template-columns:260px 1fr;align-items:center;gap:12px"><div><div class="mono">--ease-spring</div><div class="mono m">cubic-bezier(.34,1.56,.64,1) · tick pop, sun settle</div></div><div style="height:22px;border-bottom:1.5px solid var(--line-strong)"><div class="b" style="animation-timing-function:var(--ease-spring)"></div></div></div><div style="display:grid;grid-template-columns:260px 1fr;align-items:center;gap:12px"><div><div class="mono">--ease-in-out</div><div class="mono m">cubic-bezier(.65,0,.35,1) · theme cross-fade</div></div><div style="height:22px;border-bottom:1.5px solid var(--line-strong)"><div class="b" style="animation-timing-function:var(--ease-in-out)"></div></div></div></div></body></html>
