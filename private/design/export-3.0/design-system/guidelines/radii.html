<!-- @dsCard group="Spacing" viewport="700x230" name="Radii" subtitle="Look-aware: Reel fields go pill; cards 22 / 24" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--bg-canvas);color:var(--ink)}.mono{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.02em}.m{color:var(--ink-muted)}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.grid{display:grid;gap:12px;padding:16px 20px}.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr"><div data-look="paper" style="padding:16px 20px;background:var(--bg-canvas);color:var(--ink)"><div class="mono m" style="margin-bottom:10px">paper</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div><i style="display:block;height:44px;border-radius:var(--radius-sm);background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong)"></i><div class="mono m" style="margin-top:4px;font-size:10px">--radius-sm</div></div><div><i style="display:block;height:44px;border-radius:var(--radius-md);background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong)"></i><div class="mono m" style="margin-top:4px;font-size:10px">--radius-md</div></div><div><i style="display:block;height:44px;border-radius:var(--radius-card);background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong)"></i><div class="mono m" style="margin-top:4px;font-size:10px">--radius-card</div></div><div><i style="display:block;height:44px;border-radius:var(--radius-field);background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong)"></i><div class="mono m" style="margin-top:4px;font-size:10px">--radius-field</div></div><div><i style="display:block;height:44px;border-radius:var(--radius-pill);background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong)"></i><div class="mono m" style="margin-top:4px;font-size:10px">--radius-pill</div></div></div></div><div data-look="reel" style="padding:16px 20px;background:var(--bg-canvas);color:var(--ink)"><div class="mono m" style="margin-bottom:10px">reel</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div><i style="display:block;height:44px;border-radius:var(--radius-sm);background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong)"></i><div class="mono m" style="margin-top:4px;font-size:10px">--radius-sm</div></div><div><i style="display:block;height:44px;border-radius:var(--radius-md);background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong)"></i><div class="mono m" style="margin-top:4px;font-size:10px">--radius-md</div></div><div><i style="display:block;height:44px;border-radius:var(--radius-card);background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong)"></i><div class="mono m" style="margin-top:4px;font-size:10px">--radius-card</div></div><div><i style="display:block;height:44px;border-radius:var(--radius-field);background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong)"></i><div class="mono m" style="margin-top:4px;font-size:10px">--radius-field</div></div><div><i style="display:block;height:44px;border-radius:var(--radius-pill);background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong)"></i><div class="mono m" style="margin-top:4px;font-size:10px">--radius-pill</div></div></div></div></div></body></html>
