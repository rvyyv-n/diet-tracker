<!-- @dsCard group="Spacing" viewport="700x260" name="Spacing scale" subtitle="--space-2 … --space-48; screen gutter 20" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--bg-canvas);color:var(--ink)}.mono{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.02em}.m{color:var(--ink-muted)}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.grid{display:grid;gap:12px;padding:16px 20px}.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}</style></head><body><div style="padding:16px 20px;display:grid;gap:8px"><div style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px"><span class="mono">--space-2</span><i style="display:block;height:12px;width:8px;border-radius:3px;background:var(--accent)"></i></div><div style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px"><span class="mono">--space-4</span><i style="display:block;height:12px;width:16px;border-radius:3px;background:var(--accent)"></i></div><div style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px"><span class="mono">--space-8</span><i style="display:block;height:12px;width:32px;border-radius:3px;background:var(--accent)"></i></div><div style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px"><span class="mono">--space-12</span><i style="display:block;height:12px;width:48px;border-radius:3px;background:var(--accent)"></i></div><div style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px"><span class="mono">--space-16</span><i style="display:block;height:12px;width:64px;border-radius:3px;background:var(--accent)"></i></div><div style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px"><span class="mono">--space-20</span><i style="display:block;height:12px;width:80px;border-radius:3px;background:var(--accent)"></i></div><div style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px"><span class="mono">--space-24</span><i style="display:block;height:12px;width:96px;border-radius:3px;background:var(--accent)"></i></div><div style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px"><span class="mono">--space-32</span><i style="display:block;height:12px;width:128px;border-radius:3px;background:var(--accent)"></i></div><div style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px"><span class="mono">--space-48</span><i style="display:block;height:12px;width:192px;border-radius:3px;background:var(--accent)"></i></div></div></body></html>
