<!-- @dsCard group="Colors" viewport="700x280" name="Intake status (inverted)" subtitle="Gain plan: under-eating is the failure. Green = at/above, gold = partial, red = well under" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--bg-canvas);color:var(--ink)}.mono{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.02em}.m{color:var(--ink-muted)}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.grid{display:grid;gap:12px;padding:16px 20px}.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}</style></head><body><div data-look="paper" data-theme="light" style="background:var(--bg-canvas);padding:14px 20px;color:var(--ink)"><div class="mono" style="margin-bottom:8px">paper · light</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div style="border-radius:16px;background:var(--intake-on-track-wash);padding:12px"><div style="display:flex;align-items:center;gap:8px;font-weight:700"><i style="width:10px;height:10px;border-radius:50%;background:var(--intake-on-track)"></i>On track</div><div class="mono m" style="margin-top:6px">--intake-on-track</div><div style="font-size:13px;margin-top:2px" class="m">at or above target</div></div><div style="border-radius:16px;background:var(--intake-partial-wash);padding:12px"><div style="display:flex;align-items:center;gap:8px;font-weight:700"><i style="width:10px;height:10px;border-radius:50%;background:var(--intake-partial)"></i>Partial</div><div class="mono m" style="margin-top:6px">--intake-partial</div><div style="font-size:13px;margin-top:2px" class="m">some blocks missed</div></div><div style="border-radius:16px;background:var(--intake-low-wash);padding:12px"><div style="display:flex;align-items:center;gap:8px;font-weight:700"><i style="width:10px;height:10px;border-radius:50%;background:var(--intake-low)"></i>Low</div><div class="mono m" style="margin-top:6px">--intake-low</div><div style="font-size:13px;margin-top:2px" class="m">well under</div></div></div></div><div data-look="paper" data-theme="dark" style="background:var(--bg-canvas);padding:14px 20px;color:var(--ink)"><div class="mono" style="margin-bottom:8px">paper · dark</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div style="border-radius:16px;background:var(--intake-on-track-wash);padding:12px"><div style="display:flex;align-items:center;gap:8px;font-weight:700"><i style="width:10px;height:10px;border-radius:50%;background:var(--intake-on-track)"></i>On track</div><div class="mono m" style="margin-top:6px">--intake-on-track</div><div style="font-size:13px;margin-top:2px" class="m">at or above target</div></div><div style="border-radius:16px;background:var(--intake-partial-wash);padding:12px"><div style="display:flex;align-items:center;gap:8px;font-weight:700"><i style="width:10px;height:10px;border-radius:50%;background:var(--intake-partial)"></i>Partial</div><div class="mono m" style="margin-top:6px">--intake-partial</div><div style="font-size:13px;margin-top:2px" class="m">some blocks missed</div></div><div style="border-radius:16px;background:var(--intake-low-wash);padding:12px"><div style="display:flex;align-items:center;gap:8px;font-weight:700"><i style="width:10px;height:10px;border-radius:50%;background:var(--intake-low)"></i>Low</div><div class="mono m" style="margin-top:6px">--intake-low</div><div style="font-size:13px;margin-top:2px" class="m">well under</div></div></div></div></body></html>
