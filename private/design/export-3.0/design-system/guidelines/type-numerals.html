<!-- @dsCard group="Type" viewport="700x230" name="Numerals" subtitle="Hero figures use --font-numeric, 700, tight tracking; all figures tabular" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--bg-canvas);color:var(--ink)}.mono{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.02em}.m{color:var(--ink-muted)}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.grid{display:grid;gap:12px;padding:16px 20px}.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr"><div data-look="paper" style="padding:16px 20px;background:var(--bg-canvas);color:var(--ink)"><div class="mono m">paper · --type-hero</div><div style="font-family:var(--font-numeric);font-size:var(--type-hero);font-weight:var(--numeric-weight);letter-spacing:var(--numeric-tracking);line-height:1;font-variant-numeric:tabular-nums">63.0</div><div style="font-variant-numeric:tabular-nums;font-size:17px;margin-top:8px"><div>2,285 kcal</div><div>113 g</div><div>3,110 kcal</div></div></div><div data-look="reel" style="padding:16px 20px;background:var(--bg-canvas);color:var(--ink)"><div class="mono m">reel · --type-hero</div><div style="font-family:var(--font-numeric);font-size:var(--type-hero);font-weight:var(--numeric-weight);letter-spacing:var(--numeric-tracking);line-height:1;font-variant-numeric:tabular-nums">63.0</div><div style="font-variant-numeric:tabular-nums;font-size:17px;margin-top:8px"><div>2,285 kcal</div><div>113 g</div><div>3,110 kcal</div></div></div></div></body></html>
