<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--bg-canvas);color:var(--ink)}.mono{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.02em}.m{color:var(--ink-muted)}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.grid{display:grid;gap:12px;padding:16px 20px}.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}</style></head><body><div data-look="paper" style="padding:14px 20px;border-bottom:1px solid var(--line);background:var(--bg-canvas);color:var(--ink)"><div class="mono m">paper · Fraunces 420 · 32 / 24</div><div style="font-family:var(--font-display);font-weight:var(--display-weight);font-size:var(--type-display-lg);line-height:1.1">Move to Phase 3</div><div style="font-family:var(--font-display);font-weight:var(--display-weight);font-size:var(--type-display-md)">Log food · Swap Snack · Settings</div></div><div data-look="reel" style="padding:14px 20px;border-bottom:1px solid var(--line);background:var(--bg-canvas);color:var(--ink)"><div class="mono m">reel · Newsreader 400 · 40 / 26; due-now title italic</div><div style="font-family:var(--font-display);font-weight:var(--display-weight);font-size:var(--type-display-lg);line-height:1.1">Move to <i>Phase 3</i></div><div style="font-family:var(--font-display);font-style:var(--due-title-style);font-size:var(--type-display-lg);line-height:1.1">Snack</div><div style="font-family:var(--font-display);font-size:var(--type-display-md)">Log food · Swap Snack · Settings</div></div></body></html>
