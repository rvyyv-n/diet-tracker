<!-- @dsCard group="Colors" viewport="700x230" name="Sun & horizon" subtitle="The brand motif: radial sun, soft halo, fading horizon line" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--bg-canvas);color:var(--ink)}.mono{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.02em}.m{color:var(--ink-muted)}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.grid{display:grid;gap:12px;padding:16px 20px}.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}</style></head><body><div style="padding:20px;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center"><div style="position:relative;width:120px;height:120px"><div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--sun-halo),transparent 65%)"></div><div style="position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:var(--sun)"></div></div><div><div style="position:relative;height:40px"><div style="position:absolute;left:0;right:0;top:20px;height:1.5px;background:linear-gradient(90deg,transparent,var(--horizon) 12%,var(--horizon) 88%,transparent)"></div><div style="position:absolute;left:0;width:62%;top:19px;height:4px;border-radius:2px;background:var(--intake-partial)"></div><div style="position:absolute;left:calc(62% - 10px);top:10px;width:20px;height:20px;border-radius:50%;background:var(--sun)"></div></div><div class="mono m" style="margin-top:12px">--sun · --sun-wide · --sun-halo · --horizon · --now-line<br>Sun only ever marks progress or “now”. Never decorative fill.</div><div style="height:28px;margin-top:10px;border-radius:14px;background:var(--sun-wide)"></div></div></div></body></html>
