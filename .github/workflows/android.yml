name: Android

# Builds the WebView shell APK described in docs/roadmap.md ("next" ->
# "Build the executables"). Runs on every push that touches the web app or
# the Android project, on demand, and on publishing a GitHub Release (where
# it attaches the signed APK as a release asset).
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "assets/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install librsvg (rasterises assets/icon.svg for the launcher icon)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Generate launcher icons
        run: |
          set -e
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            rsvg-convert -w "$size" -h "$size" assets/icon.svg -o "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/rise-release.keystore

      - name: Build the release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: keystore/rise-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rise-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Attach the APK to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
