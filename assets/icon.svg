<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- black tile -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <!-- egg white: centred, near-symmetric, filling most of the tile so it
       still reads at 16px -->
  <ellipse cx="256" cy="258" rx="158" ry="190" fill="#FFFFFF" stroke="#E6DFD8" stroke-width="14"/>
  <!-- yolk: one bold warm circle a touch below centre, with a slightly
       deeper core for depth — no faint highlight, no gold -->
  <circle cx="256" cy="286" r="92" fill="#E8A55A"/>
  <circle cx="256" cy="286" r="60" fill="#E0913F"/>
</svg>
