<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The status-bar / task-switcher colour, one per scheme. A pinned Light or
         Dark theme (Settings) adds a third, media-less <meta> from
         src/js/core/theme.js that overrides both. -->
    <meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181715" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rise" />
    <script>
      // Pin the theme before first paint so a chosen Light/Dark doesn't flash
      // the OS default. Mirrors src/js/core/theme.js; reads localStorage
      // directly because the ES modules load later. The prefers-color-scheme
      // path needs no JS — this only runs when a theme is explicitly pinned.
      try {
        var t = JSON.parse(localStorage.getItem("wgt:profile") || "{}").themePref;
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          var m = document.createElement("meta");
          m.name = "theme-color";
          m.id = "tc-forced";
          m.content = t === "dark" ? "#181715" : "#FAF9F5";
          document.head.appendChild(m);
        }
      } catch (e) {}
    </script>
    <title>Rise: Diet Tracker</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <link rel="stylesheet" href="src/css/tokens.css" />
    <link rel="stylesheet" href="src/css/app.css" />
  </head>
  <body>
    <main id="app" class="app-shell">
      <noscript>This app runs entirely in the browser and needs JavaScript enabled.</noscript>
    </main>
    <script type="module" src="src/js/app.js"></script>
    <script>
      // Register the offline service worker. Skipped on file:// where it can't run.
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
